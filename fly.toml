# fly.toml app configuration file generated for doodrop-falling-firefly-4441 on 2025-12-18T10:35:23-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doodrop-falling-firefly-4441'
primary_region = 'sjc'

[build]
  builder = 'paketobuildpacks/builder:full'
  buildpacks = ['gcr.io/paketo-buildpacks/python']

[deploy]
  release_command = 'python -c "from doodrop_app import app, db; app.app_context().push(); db.create_all()"'

[env]
  PYTHONUNBUFFERED = 'true'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
