{% extends "base.html" %}

{% block title %}Login - DooDrop{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 450px;
        margin: 3rem auto;
    }

    .auth-card {
        background: white;
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .auth-card h1 {
        font-size: 2rem;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .auth-card .subtitle {
        text-align: center;
        color: var(--gray);
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    .form-group label {
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .auth-card button {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        margin-top: 1rem;
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.95rem;
    }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .divider {
        text-align: center;
        margin: 2rem 0;
        color: var(--gray);
        position: relative;
    }

    .divider::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: var(--cream);
        z-index: 1;
    }

    .divider span {
        position: relative;
        z-index: 2;
        background: white;
        padding: 0 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🐾 Welcome Back!</h1>
        <p class="subtitle">Log in to your DooDrop account</p>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="your@email.com"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                >
            </div>

            <button type="submit" class="btn">Log In 🔓</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            <a href="/forgot-password" style="color: var(--gray); text-decoration: none;">Forgot your password?</a>
        </p>
        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one now!</a>
        </div>
    </div>
</div>
{% endblock %}
